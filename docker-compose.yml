version: '3.8'

services:
  localstack:
    container_name: localstack-commentia
    image: localstack/localstack:latest
    ports:
      - "4566:4566"  # LocalStack Gateway
      - "4510-4559:4510-4559"  # external services port range
    environment:
      - DEBUG=${DEBUG-}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_EXECUTOR=${LAMBDA_EXECUTOR-}
      - SERVICES=dynamodb,apigateway,lambda,s3,cloudfront
      - DATA_DIR=${DATA_DIR-}
      - MAIN_CONTAINER_NAME=localstack-commentia
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - localstack-network

  dynamodb-local:
    container_name: dynamodb-local-commentia
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - localstack-network

networks:
  localstack-network:
    driver: bridge